name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install --requirement app/requirements-dev.txt
      - run: pytest app
      - run: docker build --provenance=false --tag platform-api:ci app
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: platform-api:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  terraform-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1
      - run: tflint --init
        working-directory: infra
      - run: tflint --recursive
        working-directory: infra
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
  terraform-plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
      - run: >-
          terraform -chdir=infra init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=platform-portfolio/dev/terraform.tfstate"
          -backend-config="region=ap-northeast-1"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - run: terraform -chdir=infra plan -input=false -lock-timeout=5m -out=tfplan
