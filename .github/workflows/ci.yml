name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install --requirement app/requirements-dev.txt
      - run: pytest app
      - run: docker build --provenance=false --tag platform-api:ci app
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: platform-api:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  terraform-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1
      - run: tflint --init
        working-directory: infra
      - run: tflint --recursive
        working-directory: infra
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
  terraform-plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
      - name: Check AWS plan configuration
        id: plan-config
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [[ -n "$AWS_ROLE_ARN" && -n "$TF_STATE_BUCKET" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping AWS plan because AWS_ROLE_ARN or TF_STATE_BUCKET is not configured."
          fi
      - uses: aws-actions/configure-aws-credentials@v5
        if: steps.plan-config.outputs.configured == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
      - if: steps.plan-config.outputs.configured == 'true'
        run: >-
          terraform -chdir=infra init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=platform-portfolio/dev/terraform.tfstate"
          -backend-config="region=ap-northeast-1"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - if: steps.plan-config.outputs.configured == 'true'
        run: terraform -chdir=infra plan -input=false -lock-timeout=5m -out=tfplan
